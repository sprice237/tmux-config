set -g xterm-keys on
set -g mouse on
setw -g mode-keys vi

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# PowerKit plugin
set -g @plugin 'fabioluciano/tmux-powerkit'

# Basic configuration
set -g @powerkit_plugins "datetime,battery,cpu,memory,git,hostname"
set -g @powerkit_theme "github"
set -g @powerkit_theme_variant "dark"
set -g @powerkit_separator_style "rounded"
set -g @powerkit_edge_separator_style ""
set -g @powerkit_initial_separator_style ""
set -g @powerkit_elements_spacing "true"
set -g @powerkit_pane_border_status "top"
set -g @powerkit_pane_border_format "{index}: {title}"

# unbind the default prefix and set to backtick
unbind C-b
set -g prefix `

# allow sending a literal backtick by pressing it twice
bind ` send-prefix

bind '\' split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file
bind r source-file ~/.config/tmux/tmux.conf

# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

run '~/.config/tmux/plugins/tpm/tpm'
